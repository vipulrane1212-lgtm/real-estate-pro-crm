name: Build & Release Android APK

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Diksha CRM Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Debug APK (Installable on Android)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK asset
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Diksha-CRM-Mobile.apk
          ls -lh Diksha-CRM-Mobile.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Diksha-CRM-Mobile-APK
          path: Diksha-CRM-Mobile.apk

      - name: Publish to GitHub Release (1-Click Download Link)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view mobile-app-latest >/dev/null 2>&1; then
            gh release upload mobile-app-latest Diksha-CRM-Mobile.apk --clobber
          else
            gh release create mobile-app-latest Diksha-CRM-Mobile.apk \
              --title "Diksha CRM Android App (Latest APK)" \
              --notes "1-click installable Android APK connected to https://real-estate-pro-crm.vercel.app with Background GPS telemetry, Live Selfie Camera attendance, Lock-Screen Follow-up Alarms, and Agreement Voice Alerts." \
              --latest
          fi
